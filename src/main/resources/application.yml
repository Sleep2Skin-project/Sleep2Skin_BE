spring:
  application:
    name: sleep2skin_be
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 해커톤 범위 결정. 엔티티에서 스키마를 만들고 DDL 스크립트를 따로 두지 않는다.
      # update는 컬럼을 추가할 뿐 이름 변경·타입 변경·삭제를 반영하지 않는다.
      # 엔티티를 파괴적으로 바꿨다면 DB를 지우고 다시 만든다.
      #   docker compose down -v && docker compose up -d mysql   (docker-compose.local.yml)
      #
      # ⚠️ 위 명령은 로컬 컨테이너 전용이다. RDS에는 대응하는 조치가 없다.
      #    그래서 로컬 .env 의 DB_HOST 에 RDS 주소를 넣으면 안 된다 — 작업 중인
      #    엔티티가 운영 스키마에 그대로 반영되고 되돌릴 수 없다 (docs/workflow.md §1).
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
